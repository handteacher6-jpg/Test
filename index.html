<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Mega House</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      color: #fff;
      background: #aab8b8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 24px;
      left: 24px;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.2);
      border-left: 4px solid #e8a761;
      border-radius: 12px;
      background: rgba(25, 36, 39, .82);
      box-shadow: 0 12px 35px rgba(18, 30, 34, .18);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }
    h1 { margin: 0 0 5px; font-size: 18px; letter-spacing: .02em; }
    #info p { margin: 0; color: #c3d0ce; font-size: 13px; }
    #hint {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      color: #eef4f1;
      background: rgba(25, 36, 39, .78);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
    }
    #reset {
      position: absolute;
      top: 26px;
      right: 26px;
      padding: 10px 15px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 9px;
      color: white;
      background: rgba(25, 36, 39, .78);
      font: inherit;
      cursor: pointer;
    }
    #reset:hover { background: #263b3d; }
    #joystick {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 124px;
      height: 124px;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 50%;
      background: rgba(25, 36, 39, .48);
      box-shadow: inset 0 0 24px rgba(255,255,255,.08);
      touch-action: none;
      user-select: none;
    }
    #joystick::before, #joystick::after {
      position: absolute;
      content: "";
      background: rgba(255,255,255,.16);
      pointer-events: none;
    }
    #joystick::before { top: 50%; left: 15%; width: 70%; height: 1px; }
    #joystick::after { top: 15%; left: 50%; width: 1px; height: 70%; }
    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 48px;
      border: 2px solid rgba(255,255,255,.7);
      border-radius: 50%;
      background: rgba(232,167,97,.85);
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    @media (max-width: 600px) {
      #info { top: 14px; left: 14px; padding: 13px 15px; }
      #reset { top: 14px; right: 14px; }
      #hint { bottom: 14px; left: auto; right: 14px; transform: none; font-size: 11px; white-space: normal; text-align: right; }
      #joystick { bottom: 22px; left: 18px; width: 112px; height: 112px; }
    }
  </style>
</head>
<body>
  <div id="info">
    <h1>Modern Mega House</h1>
    <p>First-person tour · Living room · Kitchen · Bedroom · Bathroom</p>
  </div>
  <button id="reset" type="button">Reset view</button>
  <div id="hint">WASD / arrows or joystick: move &nbsp;·&nbsp; Drag: look around</div>
  <div id="joystick" role="application" aria-label="Movement joystick">
    <div id="joystick-knob"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaab8b8);
    scene.fog = new THREE.Fog(0xaab8b8, 300, 650);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.78;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xeaf5ff, 0x73705d, 0.85));
    const sunlight = new THREE.DirectionalLight(0xffe2b8, 1.25);
    sunlight.position.set(-80, 150, 100);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.set(1024, 1024);
    sunlight.shadow.camera.left = -160;
    sunlight.shadow.camera.right = 160;
    sunlight.shadow.camera.top = 160;
    sunlight.shadow.camera.bottom = -160;
    scene.add(sunlight);

    const mat = (color, roughness = 0.82) => new THREE.MeshStandardMaterial({ color, roughness });
    const materials = {
      grass: mat(0x687653),
      path: mat(0xc7b99f),
      wall: mat(0xf0e9dc),
      side: mat(0xd8d0c2),
      wood: mat(0x9a6847),
      darkWood: mat(0x493b32),
      floor: mat(0xb78a63),
      rug: mat(0x758c83),
      sofa: mat(0xd49b70),
      cushion: mat(0xf0d6b7),
      fabric: mat(0xeee7d8),
      metal: mat(0x354447, 0.38),
      glass: new THREE.MeshStandardMaterial({ color: 0x9ccbd0, roughness: 0.25, metalness: 0.12 }),
      leaf: mat(0x597457),
      leafLight: mat(0x78966c),
      flower: mat(0xe9a475)
    };

    function box(parent, width, height, depth, material, x, y, z, castShadow = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(parent, radiusTop, radiusBottom, height, material, x, y, z, segments = 16) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), materials.grass);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.13;
    ground.receiveShadow = true;
    scene.add(ground);

    const house = new THREE.Group();
    scene.add(house);
    house.scale.set(2.5, 1, 2.5);

    // Solid walls enclose the room; the front doorway and roof slats keep it explorable.
    box(house, 8.2, 0.24, 6.7, materials.floor, 0, 0, 0);
    [-3.6125, -0.3, 3.3125].forEach((x, index) => {
      const widths = [0.975, 2.55, 1.575];
      box(house, widths[index], 4.7, 0.24, materials.wall, x, 2.35, -3.35);
    });
    [-2.425, 2.425].forEach((x) => box(house, 3.35, 4.7, 0.24, materials.wall, x, 2.35, 3.35));
    box(house, 0.24, 4.7, 6.7, materials.side, -4.1, 2.35, 0);
    box(house, 0.24, 4.7, 6.7, materials.side, 4.1, 2.35, 0);
    box(house, 1.5, 0.8, 0.24, materials.wall, 0, 4.3, 3.35);
    box(house, 8.7, 0.22, 0.32, materials.darkWood, 0, 4.83, -3.35);
    box(house, 0.28, 0.22, 6.8, materials.darkWood, -4.1, 4.83, 0);
    box(house, 0.28, 0.22, 6.8, materials.darkWood, 4.1, 4.83, 0);

    // Bedroom partition with an open doorway.
    box(house, 0.14, 3.2, 2.05, materials.wall, -1.35, 1.6, -2.125);
    box(house, 0.14, 3.2, 0.55, materials.wall, -1.35, 1.6, 0.225);
    box(house, 2.5, 0.045, 3.45, materials.rug, -2.7, 0.145, -1.55, false);

    // A furnished bedroom: bed, pillows, bedside tables, and a wardrobe.
    box(house, 1.65, 0.25, 2.1, materials.darkWood, -2.75, 0.32, -2.0);
    box(house, 1.58, 0.34, 2.0, materials.fabric, -2.75, 0.59, -2.0);
    box(house, 1.58, 0.12, 0.72, materials.cushion, -2.75, 0.82, -2.55);
    [-3.1, -2.4].forEach((x) => {
      const pillow = box(house, 0.56, 0.18, 0.4, materials.fabric, x, 0.87, -2.67);
      pillow.rotation.x = -0.12;
    });
    [-3.65, -1.85].forEach((x) => {
      box(house, 0.48, 0.52, 0.48, materials.wood, x, 0.42, -0.5);
      box(house, 0.52, 0.07, 0.52, materials.darkWood, x, 0.72, -0.5);
    });
    box(house, 0.4, 1.8, 1.2, materials.side, -3.75, 1.05, -1.3);
    box(house, 0.44, 0.08, 1.24, materials.wood, -3.75, 1.99, -1.3);

    // A separate bathroom sits behind the front-right partition.
    box(house, 1.8, 0.045, 2.7, materials.path, 3.05, 0.145, 1.75, false);
    box(house, 1.95, 3.2, 0.14, materials.wall, 3.05, 1.6, 0.15);
    box(house, 0.5, 3.2, 0.14, materials.wall, 2.3, 1.6, 0.15);
    box(house, 0.45, 3.2, 0.14, materials.wall, 3.8, 1.6, 0.15);
    box(house, 0.14, 2.25, 1.0, materials.glass, 3.52, 1.18, 2.55, false);
    box(house, 0.14, 2.25, 1.0, materials.glass, 2.54, 1.18, 2.55, false);
    box(house, 1.12, 0.12, 1.0, materials.fabric, 3.03, 0.12, 2.55, false);
    box(house, 0.72, 0.45, 0.48, materials.fabric, 2.55, 0.38, 0.9);
    box(house, 0.82, 0.1, 0.52, materials.wood, 2.55, 0.66, 0.9);
    cylinder(house, 0.27, 0.31, 0.48, materials.fabric, 3.45, 0.28, 1.1);
    box(house, 0.48, 0.42, 0.55, materials.fabric, 3.45, 0.43, 1.48);
    cylinder(house, 0.16, 0.16, 0.1, materials.fabric, 3.45, 0.7, 1.42);

    // Warm pendants and framed art add more character to the enlarged interior.
    const pendant = mat(0xffdf9e, 0.4);
    [-2.4, 0, 2.4].forEach((x) => {
      cylinder(house, 0.04, 0.04, 1.1, materials.metal, x, 4.35, 0.2);
      const shade = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.35, 20, 1, true), materials.darkWood);
      shade.position.set(x, 3.78, 0.2);
      shade.rotation.x = Math.PI;
      house.add(shade);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), pendant);
      bulb.position.set(x, 3.67, 0.2);
      house.add(bulb);
    });
    box(house, 0.12, 1.4, 1.8, materials.darkWood, 3.94, 3.1, 0.25);
    box(house, 0.05, 1.12, 1.52, materials.flower, 3.84, 3.1, 0.25, false);
    box(house, 0.16, 0.1, 2, materials.wood, 3.86, 2.35, 0.25);
    [-0.45, 0, 0.45].forEach((z, index) => {
      box(house, 0.38, 0.52, 0.34, [materials.leaf, materials.sofa, materials.cushion][index],
        3.76, 1.98, z + 0.25);
    });

    // Open pergola roof shades the interior while leaving it visible from above.
    for (let z = -2.7; z <= 2.2; z += 1.15) {
      box(house, 8.55, 0.14, 0.24, materials.wood, 0, 5.03, z);
    }
    box(house, 8.7, 0.18, 0.22, materials.darkWood, 0, 5.03, 2.8);

    // Picture windows with slim timber frames and crossbars.
    [-2.35, 1.75].forEach((x) => {
      box(house, 1.55, 2.325, 0.24, materials.wall, x, 1.1625, -3.35);
      box(house, 1.55, 0.925, 0.24, materials.wall, x, 4.2375, -3.35);
      box(house, 1.55, 1.45, 0.035, materials.glass, x, 3.05, -3.35, false);
      [-0.81, 0.81].forEach((offset) => {
        box(house, 0.07, 1.62, 0.09, materials.wood, x + offset, 3.05, -3.14);
      });
      [-0.77, 0.77].forEach((offset) => {
        box(house, 1.68, 0.07, 0.09, materials.wood, x, 3.05 + offset, -3.14);
      });
      box(house, 0.055, 1.45, 0.08, materials.wood, x, 3.05, -3.11);
      box(house, 1.55, 0.055, 0.08, materials.wood, x, 3.05, -3.11);
      box(house, 1.8, 0.12, 0.28, materials.fabric, x, 2.19, -3.08);
    });

    // Living area: a soft rug, sofa, cushions, coffee table, and a leafy plant.
    box(house, 4.6, 0.045, 3.1, materials.rug, -0.1, 0.145, 0.45, false);
    box(house, 3.15, 0.72, 0.95, materials.sofa, -1.05, 0.6, 1.45);
    box(house, 3.15, 0.95, 0.3, materials.sofa, -1.05, 1.12, 1.82);
    [-2.3, 0.2].forEach((x) => box(house, 0.3, 0.68, 0.95, materials.sofa, x, 0.66, 1.45));
    [-1.85, -0.8].forEach((x) => {
      const pillow = box(house, 0.72, 0.22, 0.6, materials.cushion, x, 1.14, 1.32);
      pillow.rotation.x = -0.16;
    });

    box(house, 2.05, 0.18, 1.08, materials.wood, 0.5, 0.62, 0.15);
    [0.5, 1.95].forEach((x) => {
      [-0.2, 0.5].forEach((z) => cylinder(house, 0.045, 0.045, 0.55, materials.darkWood, x, 0.34, z));
    });
    box(house, 1.55, 0.12, 0.12, materials.fabric, 0.5, 0.78, 0.15);

    // A compact kitchen along the back wall.
    box(house, 2.5, 0.86, 0.78, materials.fabric, 2.65, 0.58, -2.5);
    box(house, 2.62, 0.12, 0.9, materials.wood, 2.65, 1.06, -2.5);
    box(house, 2.5, 1.12, 0.16, materials.side, 2.65, 1.65, -3.02);
    box(house, 2.62, 0.12, 0.21, materials.wood, 2.65, 2.28, -2.96);
    [1.9, 2.65, 3.4].forEach((x) => box(house, 0.025, 0.65, 0.02, materials.wood, x, 0.58, -2.09));
    box(house, 0.72, 0.035, 0.48, materials.metal, 2.65, 1.13, -2.52);
    cylinder(house, 0.035, 0.035, 0.32, materials.metal, 2.65, 1.28, -2.52);
    box(house, 0.32, 0.07, 0.32, materials.metal, 3.35, 1.17, -2.5);
    for (let shelf = 0; shelf < 2; shelf++) {
      box(house, 1.15, 0.08, 0.3, materials.wood, 0.85, 1.7 + shelf * 0.65, -3.02);
      [0, 1, 2].forEach((book) => {
        box(house, 0.14, 0.34 + (book % 2) * 0.08, 0.2,
          [materials.sofa, materials.leaf, materials.flower][(book + shelf) % 3],
          0.42 + book * 0.19, 1.9 + shelf * 0.65, -2.98);
      });
    }

    // Dining nook beside the kitchen.
    cylinder(house, 0.63, 0.63, 0.12, materials.wood, 2.05, 1.04, -0.75, 32);
    cylinder(house, 0.09, 0.14, 0.88, materials.darkWood, 2.05, 0.58, -0.75);
    [[1.05, -0.75], [2.95, -0.75]].forEach(([x, z]) => {
      box(house, 0.54, 0.12, 0.55, materials.sofa, x, 0.55, z);
      box(house, 0.54, 0.58, 0.12, materials.sofa, x, 0.85, z - 0.22);
      [x - 0.18, x + 0.18].forEach((legX) => {
        cylinder(house, 0.025, 0.025, 0.48, materials.darkWood, legX, 0.29, z);
      });
    });

    // A tall floor lamp and a small potted plant add a lived-in touch.
    cylinder(house, 0.19, 0.23, 0.08, materials.darkWood, -3.25, 0.2, 0.35);
    cylinder(house, 0.025, 0.025, 2.25, materials.metal, -3.25, 1.34, 0.35);
    cylinder(house, 0.3, 0.42, 0.58, materials.fabric, -3.25, 2.65, 0.35, 24);
    cylinder(house, 0.22, 0.28, 0.48, materials.wood, 0.9, 0.42, 2.2);
    [-0.18, 0, 0.18].forEach((offset, index) => {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 12), index % 2 ? materials.leaf : materials.leafLight);
      leaf.position.set(0.9 + offset, 0.98 + (index === 1 ? 0.2 : 0), 2.2);
      leaf.scale.set(0.7, 1.4, 0.7);
      leaf.castShadow = true;
      house.add(leaf);
    });

    // A small character can walk through the front doorway and around the furniture.
    const character = new THREE.Group();
    character.scale.set(0.1, 1, 0.1);
    character.position.set(0, 0.12, 4.35);
    character.visible = false;
    house.add(character);
    const skin = mat(0xb97854);
    const shirt = mat(0x456d70);
    const pants = mat(0x344452);
    const characterDark = mat(0x292c31);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 16), skin);
    head.position.y = 1.48;
    head.castShadow = true;
    character.add(head);
    box(character, 0.46, 0.58, 0.27, shirt, 0, 1.02, 0);
    box(character, 0.16, 0.13, 0.28, characterDark, 0, 0.65, -0.015);
    const leftArm = new THREE.Group();
    const rightArm = new THREE.Group();
    leftArm.position.set(-0.3, 1.2, 0);
    rightArm.position.set(0.3, 1.2, 0);
    character.add(leftArm, rightArm);
    box(leftArm, 0.13, 0.48, 0.14, shirt, 0, -0.22, 0);
    box(rightArm, 0.13, 0.48, 0.14, shirt, 0, -0.22, 0);
    const leftLeg = new THREE.Group();
    const rightLeg = new THREE.Group();
    leftLeg.position.set(-0.12, 0.68, 0);
    rightLeg.position.set(0.12, 0.68, 0);
    character.add(leftLeg, rightLeg);
    box(leftLeg, 0.17, 0.48, 0.18, pants, 0, -0.22, 0);
    box(rightLeg, 0.17, 0.48, 0.18, pants, 0, -0.22, 0);
    box(leftLeg, 0.2, 0.1, 0.32, characterDark, 0, -0.46, -0.035);
    box(rightLeg, 0.2, 0.1, 0.32, characterDark, 0, -0.46, -0.035);

    // A stepping-stone path leads up to the open front of the house.
    const landscape = new THREE.Group();
    landscape.scale.set(2.5, 1, 2.5);
    scene.add(landscape);
    for (let i = 0; i < 6; i++) {
      const stone = box(landscape, 1.65, 0.12, 0.72, materials.path, 0, -0.035, 4.1 + i * 0.95, false);
      stone.rotation.y = (i % 2 ? -1 : 1) * 0.035;
    }
    box(landscape, 10.5, 0.16, 0.16, materials.wood, 0, 0.08, 7.8);
    box(landscape, 10.5, 0.16, 0.16, materials.wood, 0, 0.08, -6.4);
    box(landscape, 0.16, 0.16, 14.2, materials.wood, -5.2, 0.08, 0.7);
    box(landscape, 0.16, 0.16, 14.2, materials.wood, 5.2, 0.08, 0.7);

    function addTree(x, z, scale) {
      const tree = new THREE.Group();
      tree.position.set(x, 0, z);
      tree.scale.setScalar(scale);
      landscape.add(tree);
      cylinder(tree, 0.16, 0.23, 1.7, materials.wood, 0, 0.8, 0);
      [[0, 2.0, 0, 0.82], [-0.45, 2.5, 0.1, 0.62], [0.4, 2.65, -0.05, 0.68]].forEach(([tx, ty, tz, size], index) => {
        const crown = new THREE.Mesh(
          new THREE.IcosahedronGeometry(size, 1),
          index % 2 ? materials.leaf : materials.leafLight
        );
        crown.position.set(tx, ty, tz);
        crown.castShadow = true;
        tree.add(crown);
      });
    }
    addTree(-7, 1, 1.3);
    addTree(7, -3, 1.5);
    addTree(-7, -5, 0.95);
    addTree(7, 6, 1.1);
    addTree(-8, -8, 1.25);

    function addBush(x, z, scale) {
      const bush = new THREE.Group();
      bush.position.set(x, 0, z);
      landscape.add(bush);
      [-0.35, 0, 0.35].forEach((offset, index) => {
        const shrub = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.48 * scale, 1),
          index % 2 ? materials.leafLight : materials.leaf
        );
        shrub.position.set(offset * scale, 0.36 * scale, 0);
        shrub.castShadow = true;
        bush.add(shrub);
      });
    }
    addBush(-5.3, 3.0, 0.9);
    addBush(5.5, 4.5, 1.05);
    addBush(5.3, -5.0, 0.8);
    addBush(-5.6, -4.8, 1.1);
    addBush(6.2, 1.2, 0.85);

    // Low garden lamps and flower beds line the long approach to the entrance.
    for (let z = 4.8; z <= 7.2; z += 1.2) {
      [-1.4, 1.4].forEach((x) => {
        cylinder(landscape, 0.045, 0.09, 1.05, materials.metal, x, 0.53, z);
        const lantern = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 8), pendant);
        lantern.position.set(x, 1.12, z);
        landscape.add(lantern);
      });
    }
    [-1, 1].forEach((side) => {
      for (let flower = 0; flower < 9; flower++) {
        const blossom = new THREE.Mesh(
          new THREE.SphereGeometry(0.16, 10, 8),
          flower % 2 ? materials.flower : materials.cushion
        );
        blossom.position.set(side * (4.4 + (flower % 3) * 0.28), 0.42, 4.3 + Math.floor(flower / 3) * 0.55);
        blossom.castShadow = true;
        landscape.add(blossom);
        cylinder(landscape, 0.025, 0.025, 0.38, materials.leaf, blossom.position.x, 0.21, blossom.position.z, 8);
      }
    });

    const initial = {
      theta: 0.25,
      pitch: 0,
      characterX: 0,
      characterZ: 4.35
    };
    let theta = initial.theta;
    let pitch = initial.pitch;
    let dragging = false;
    let previousPointer = { x: 0, y: 0 };
    let joystickPointer = null;
    let joystickX = 0;
    let joystickY = 0;
    const pressedKeys = new Set();
    const clock = new THREE.Clock();
    const obstacles = [
      { x: -1.05, z: 1.45, halfX: 1.7, halfZ: 0.62 },
      { x: 0.5, z: 0.15, halfX: 1.15, halfZ: 0.67 },
      { x: 2.65, z: -2.5, halfX: 1.35, halfZ: 0.55 },
      { x: 2.05, z: -0.75, halfX: 0.78, halfZ: 0.78 },
      { x: -1.35, z: -2.125, halfX: 0.11, halfZ: 1.08 },
      { x: -1.35, z: 0.225, halfX: 0.11, halfZ: 0.3 },
      { x: 3.05, z: 0.15, halfX: 1.02, halfZ: 0.11 },
      { x: 2.3, z: 0.15, halfX: 0.27, halfZ: 0.11 },
      { x: 3.8, z: 0.15, halfX: 0.24, halfZ: 0.11 },
      { x: -2.75, z: -2.0, halfX: 0.84, halfZ: 1.05 },
      { x: -3.75, z: -1.3, halfX: 0.22, halfZ: 0.62 },
      { x: 3.03, z: 2.55, halfX: 0.62, halfZ: 0.55 },
      { x: 2.55, z: 0.9, halfX: 0.42, halfZ: 0.3 },
      { x: 3.45, z: 1.32, halfX: 0.3, halfZ: 0.56 }
    ];

    function updateCamera() {
      const eye = character.localToWorld(new THREE.Vector3(0, 1.55, 0));
      const direction = new THREE.Vector3(
        -Math.sin(theta) * Math.cos(pitch),
        Math.sin(pitch),
        -Math.cos(theta) * Math.cos(pitch)
      );
      camera.position.copy(eye);
      camera.lookAt(eye.add(direction));
    }
    updateCamera();

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
        event.preventDefault();
        pressedKeys.add(key);
      }
    });
    window.addEventListener('keyup', (event) => pressedKeys.delete(event.key.toLowerCase()));
    window.addEventListener('blur', () => pressedKeys.clear());

    function canMoveTo(x, z) {
      if (x < -3.72 || x > 3.72 || z < -3.02 || z > 8.5) return false;
      if (z > 3.02 && z < 3.72 && Math.abs(x) > 0.42) return false;
      return !obstacles.some((obstacle) =>
        Math.abs(x - obstacle.x) < obstacle.halfX &&
        Math.abs(z - obstacle.z) < obstacle.halfZ
      );
    }

    function moveCharacter(delta) {
      const forward = Number(pressedKeys.has('w') || pressedKeys.has('arrowup')) -
        Number(pressedKeys.has('s') || pressedKeys.has('arrowdown')) - joystickY;
      const sideways = Number(pressedKeys.has('d') || pressedKeys.has('arrowright')) -
        Number(pressedKeys.has('a') || pressedKeys.has('arrowleft')) + joystickX;
      const length = Math.hypot(forward, sideways);
      if (!length) {
        leftLeg.rotation.x = THREE.MathUtils.damp(leftLeg.rotation.x, 0, 12, delta);
        rightLeg.rotation.x = THREE.MathUtils.damp(rightLeg.rotation.x, 0, 12, delta);
        leftArm.rotation.x = THREE.MathUtils.damp(leftArm.rotation.x, 0, 12, delta);
        rightArm.rotation.x = THREE.MathUtils.damp(rightArm.rotation.x, 0, 12, delta);
        return;
      }

      const forwardX = -Math.sin(theta);
      const forwardZ = -Math.cos(theta);
      const rightX = Math.cos(theta);
      const rightZ = -Math.sin(theta);
      const moveX = (forward * forwardX + sideways * rightX) / length;
      const moveZ = (forward * forwardZ + sideways * rightZ) / length;
      const speed = 0.65 * delta;
      const nextX = character.position.x + moveX * speed;
      const nextZ = character.position.z + moveZ * speed;
      if (canMoveTo(nextX, character.position.z)) character.position.x = nextX;
      if (canMoveTo(character.position.x, nextZ)) character.position.z = nextZ;
      character.rotation.y = Math.atan2(-moveX, -moveZ);
      const stride = Math.sin(clock.elapsedTime * 10) * 0.42;
      leftLeg.rotation.x = stride;
      rightLeg.rotation.x = -stride;
      leftArm.rotation.x = -stride * 0.65;
      rightArm.rotation.x = stride * 0.65;
    }

    renderer.domElement.addEventListener('pointerdown', (event) => {
      dragging = true;
      previousPointer = { x: event.clientX, y: event.clientY };
      renderer.domElement.setPointerCapture(event.pointerId);
    });
    renderer.domElement.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      theta -= (event.clientX - previousPointer.x) * 0.006;
      pitch = THREE.MathUtils.clamp(pitch - (event.clientY - previousPointer.y) * 0.006, -0.65, 0.65);
      previousPointer = { x: event.clientX, y: event.clientY };
      updateCamera();
    });
    renderer.domElement.addEventListener('pointerup', () => { dragging = false; });
    renderer.domElement.addEventListener('pointercancel', () => { dragging = false; });

    const joystick = document.getElementById('joystick');
    const joystickKnob = document.getElementById('joystick-knob');
    function updateJoystick(event) {
      const rect = joystick.getBoundingClientRect();
      const maxTravel = rect.width * 0.32;
      const dx = event.clientX - (rect.left + rect.width / 2);
      const dy = event.clientY - (rect.top + rect.height / 2);
      const distance = Math.min(Math.hypot(dx, dy), maxTravel);
      const angle = Math.atan2(dy, dx);
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;
      joystickX = x / maxTravel;
      joystickY = y / maxTravel;
      joystickKnob.style.left = `calc(50% + ${x}px)`;
      joystickKnob.style.top = `calc(50% + ${y}px)`;
    }
    joystick.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      joystickPointer = event.pointerId;
      joystick.setPointerCapture(event.pointerId);
      updateJoystick(event);
    });
    joystick.addEventListener('pointermove', (event) => {
      if (event.pointerId === joystickPointer) updateJoystick(event);
    });
    function releaseJoystick(event) {
      if (event.pointerId !== joystickPointer) return;
      joystickPointer = null;
      joystickX = 0;
      joystickY = 0;
      joystickKnob.style.left = '50%';
      joystickKnob.style.top = '50%';
    }
    joystick.addEventListener('pointerup', releaseJoystick);
    joystick.addEventListener('pointercancel', releaseJoystick);

    document.getElementById('reset').addEventListener('click', () => {
      theta = initial.theta;
      pitch = initial.pitch;
      character.position.set(initial.characterX, 0.12, initial.characterZ);
      character.rotation.y = 0;
      pressedKeys.clear();
      if (joystickPointer !== null) joystick.releasePointerCapture(joystickPointer);
      joystickPointer = null;
      joystickX = 0;
      joystickY = 0;
      joystickKnob.style.left = '50%';
      joystickKnob.style.top = '50%';
      updateCamera();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      moveCharacter(delta);
      updateCamera();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
