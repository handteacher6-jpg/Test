<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Modern Cube House</title>
  <style>
    body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
    #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border-left: 4px solid #f59e0b; }
  </style>
</head>
<body>
  <div id="info">
    <h2 style="margin:0;color:#f59e0b;">Modern Cube House</h2>
    <p style="margin:5px 0 0 0;color:#aaa;">Interactive 3D Prototype</p>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 墙体 (白色立方体)
    const houseGeometry = new THREE.BoxGeometry(2, 2, 2);
    const houseMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: false });
    const house = new THREE.Mesh(houseGeometry, houseMaterial);
    scene.add(house);

    // 屋顶 (红色金字塔/四棱锥)
    const roofGeometry = new THREE.ConeGeometry(1.8, 1, 4);
    const roofMaterial = new THREE.MeshBasicMaterial({ color: 0xff4444 });
    const roof = new THREE.Mesh(roofGeometry, roofMaterial);
    roof.position.y = 1.5;
    roof.rotation.y = Math.PI / 4;
    scene.add(roof);

    camera.position.z = 5;
    camera.position.y = 1;

    function animate() {
      requestAnimationFrame(animate);
      house.rotation.y += 0.01;
      roof.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
